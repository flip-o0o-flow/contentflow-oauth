<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AutoFlow – inloggen</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#15171C; color:#E4E6EB;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .kaart { max-width: 520px; margin: 24px; padding: 28px; background:#1E212A; border-radius: 20px; }
  h1 { font-size: 1.35rem; margin: 0 0 8px; }
  p { color:#BDC0C1; line-height: 1.45; }
  a.knop { display:inline-block; margin: 10px 0; padding: 12px 18px; border-radius: 12px; text-decoration:none;
           color:#15171C; font-weight:600; background: linear-gradient(135deg, #5A5FE0, #2DD4BF); }
  code { display:block; word-break: break-all; background:#2A2E37; padding: 10px; border-radius: 10px; font-size: .85rem; }
  button { margin-top: 8px; padding: 8px 14px; border-radius: 10px; border: 1px solid #3A3F4B; background:#2A2E37; color:#E4E6EB; }
  .klein { font-size: .85rem; }
</style>
</head>
<body>
<div class="kaart">
  <h1>AutoFlow</h1>
  <div id="inhoud"><p>Even geduld…</p></div>
</div>
<script>
(function () {
  var q = location.search || "";
  var el = document.getElementById("inhoud");
  var mobiel = /Android|iPhone|iPad/i.test(navigator.userAgent);
  if (!q || q.indexOf("code=") < 0) {
    el.innerHTML = "<p>Deze pagina vangt de DeviantArt-login voor AutoFlow op. Start het inloggen vanuit de app.</p>" +
      (q.indexOf("error") >= 0 ? "<p>DeviantArt gaf een fout terug: <code>" + q.replace(/</g, "&lt;") + "</code></p>" : "");
    return;
  }
  var app = "autoflow://oauth" + q;
  var pc = "http://127.0.0.1:48765/oauth" + q;
  var huidige = location.href;
  el.innerHTML =
    "<p>Ingelogd bij DeviantArt. Nu terug naar AutoFlow:</p>" +
    "<a class='knop' href='" + app + "'>Open AutoFlow op deze telefoon</a><br>" +
    "<a class='knop' href='" + pc + "'>Terug naar AutoFlow op deze pc</a>" +
    "<p class='klein'>Werkt geen van beide? Kopieer dit adres en plak het in AutoFlow onder Instellingen → DeviantArt · account:</p>" +
    "<code id='url'></code><button onclick='navigator.clipboard.writeText(document.getElementById(\"url\").textContent)'>Kopiëren</button>";
  document.getElementById("url").textContent = huidige;
  // Meteen proberen: op de telefoon de app openen, op de pc het lokale AutoFlow bereiken.
  setTimeout(function () { location.href = mobiel ? app : pc; }, 400);
})();
</script>
</body>
</html>
